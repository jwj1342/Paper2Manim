name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (manimpango needs pangocairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check paper2manim tests

      - name: Ruff format check
        run: ruff format --check paper2manim tests
        continue-on-error: true  # format drift is a warning, not a blocker (for now)

      - name: Pytest (fast, mock-only)
        run: pytest -m "not slow" -v --tb=short
        env:
          # Make sure tests never accidentally hit a real API
          MIMO_API_KEY: "tp-fake-ci-key"
          MIMO_BASE_URL: "http://localhost:0"
