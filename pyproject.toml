[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2manim"
version = "0.1.0"
description = "LLM multi-agent system that converts academic papers into Manim animation videos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "jwj" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "openai>=1.50",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "click>=8.1",
    "python-dotenv>=1.0",
    "manim==0.20.1",
    "rich>=13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mvp2 = ["marker-pdf>=1.0"]
emb = [
    # Episodic Memory Bank backend deps. The EMB module gracefully degrades
    # to InMemoryVectorIndex + HashEmbedder when these are absent, so they're
    # optional; only install when you want the real backend.
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
    "matplotlib>=3.8",  # plot_evolution.py Hero Plot
]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
paper2manim = "paper2manim.cli:cli"

[tool.setuptools.packages.find]
include = ["paper2manim*"]
exclude = ["tests*", "runs*", "examples*"]

[tool.pytest.ini_options]
markers = [
    "slow: requires real LLM API or real Manim render (skipped on login node)",
]
testpaths = ["tests"]
# Silence noisy upstream warnings that have no actionable fix on our side and
# that otherwise clutter every CI run. Add new entries sparingly and prefer a
# narrowly-scoped `message=` regex over a blanket category filter.
filterwarnings = [
    # langgraph 1.x emits this on import; class is
    # langchain_core._api.deprecation.LangChainPendingDeprecationWarning, a
    # subclass of PendingDeprecationWarning. Filter by full dotted category to
    # win against the early-import order.
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    # langchain-openai 0.3 + pydantic 2.13 surface this on every
    # with_structured_output call. Harmless; serializer just sees a Mock.
    # Matched by message because the class lives in pydantic_core (C ext)
    # and isn't importable as a pure-Python warning category.
    "ignore:Pydantic serializer warnings:UserWarning",
    "ignore:.*PydanticSerializationUnexpectedValue.*:UserWarning",
]

[tool.coverage.run]
source = ["paper2manim"]
branch = true
omit = [
    "*/__pycache__/*",
    "paper2manim/__main__.py",
]

[tool.coverage.report]
# No fail_under yet — first quantify, then tighten. See progress.md §To Do F.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# Pragmatic baseline — strict-mode pass is tracked as progress.md §To Do F debt.
# These get us type-aware checking on first-party code without forcing a 100+
# fix marathon. Tighten one flag at a time.
python_version = "3.11"
files = ["paper2manim"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
# Skip the third-party-heavy LangGraph / LangChain edges until we've added
# protocols for the parts we actually consume.
exclude = [
    "paper2manim/graphs/.*",
    "paper2manim/infrastructure/.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
