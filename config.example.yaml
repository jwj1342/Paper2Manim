# Paper2Manim multi-provider model registry
# -----------------------------------------------------------------------------
# Copy this file to `config.yaml` (gitignored) and fill in your API keys.
# api_key values can be inlined or reference env vars with `$VAR_NAME`
# (resolved at load time).
#
# provider:      "openai_compatible" (OpenAI-style /chat/completions) | "anthropic"
# auth_style:    "header_api_key" (default; SDK picks Bearer for openai, x-api-key for anthropic)
#                | "bearer"       (force Authorization: Bearer — required for Azure-hosted Claude)
# supports_vision / supports_thinking: declared capabilities used by the LLM/VLM factory.
# omit_temperature: set true for endpoints that reject the `temperature` param
#                   (e.g. Azure-hosted Claude Opus 4.7 returns 400 deprecated).
# -----------------------------------------------------------------------------

models:
  # Text-only chat model (storyboarder / coder / reviewer / summarizer).
  # Example provider lines kept commented — fill in for your stack.
  - name: text-flash
    display_name: Text Model (flash tier)
    provider: openai_compatible          # or: anthropic
    model: ""                            # e.g. mimo-v2.5 / deepseek-chat / gpt-4o-mini
    api_key: $TEXT_FLASH_API_KEY
    base_url: ""                         # e.g. https://api.openai.com/v1
    temperature: 0.2
    max_tokens: 8192
    timeout: 120
    supports_vision: false
    supports_thinking: false
    # auth_style: header_api_key

  - name: text-pro
    display_name: Text Model (pro / long context)
    provider: openai_compatible
    model: ""                            # e.g. mimo-v2.5-pro
    api_key: $TEXT_PRO_API_KEY
    base_url: ""
    temperature: 0.2
    max_tokens: 8192
    timeout: 600
    supports_vision: false
    supports_thinking: false

  # Vision-capable model (VLM scene reviewer + visual revision).
  # supports_vision: true is REQUIRED — get_vlm() will reject this otherwise.
  - name: vision-model
    display_name: Vision Reviewer
    provider: openai_compatible          # or: anthropic
    model: ""                            # e.g. doubao-seed-2-0-pro-260215 / claude-sonnet-4-6-1
    api_key: $VISION_API_KEY
    base_url: ""                         # e.g. https://ark.cn-beijing.volces.com/api/v3
    temperature: 0.0
    max_tokens: 4096
    timeout: 120
    supports_vision: true
    supports_thinking: false
    # auth_style: bearer                 # uncomment for Azure-hosted Claude
    # omit_temperature: true             # required for Azure-hosted Claude Opus 4.7

# Role-to-model mapping. Canonical roles consumed by the LangGraph nodes.
model_roles:
  global_reader: text-pro
  scene_planner: text-flash
  scene_coder: text-flash
  render_fixer: text-flash
  visual_reviser: text-flash
  final_summarizer: text-pro
  vision_checker: vision-model

# VLM Multi-Dim Scoring loop knobs are CLI-driven, not YAML:
#   paper2manim mvp2 --vlm --max-visual-revisions N
# (frame_sample_count is hard-coded to 4 in graphs/scene_graph.py.frame_sampler_node.)
