# ManimAgent model configuration.
# Copy to config.yaml and set MANIMAGENT_API_KEY in .env or your environment.
# All text and vision roles share one endpoint, as in the paper.
# Change model/base_url/provider to use a different endpoint.
models:
  - name: manimagent
    provider: openai_compatible
    model: gpt-5.5
    api_key: $MANIMAGENT_API_KEY
    base_url: https://api.openai.com/v1
    temperature: 0.2
    max_tokens: 8192
    timeout: 120
    supports_vision: true
    supports_thinking: false
    # omit_temperature: true  # Enable if your endpoint rejects temperature.

model_roles:
  global_reader: manimagent
  scene_planner: manimagent
  scene_coder: manimagent
  render_fixer: manimagent
  visual_reviser: manimagent
  final_summarizer: manimagent
  vision_checker: manimagent

